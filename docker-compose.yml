version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: starmind_db
    restart: always
    environment:
      POSTGRES_USER: starmind
      POSTGRES_PASSWORD: starmind_password
      POSTGRES_DB: starmind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starmind"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: starmind_backend
    restart: always
    environment:
      # Use the db service name from docker-compose
      - DATABASE_URL=postgresql+asyncpg://starmind:starmind_password@db:5432/starmind
      # These will be read from your host .env file or environment variables
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: starmind_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:

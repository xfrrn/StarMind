[project]
name = "starmind-backend"
version = "0.1.0"
description = "StarMind - AI-powered GitHub starred repositories analyzer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "openai>=1.60.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "alembic>=1.14.0",
    "json-repair>=0.58.5",
    "markdown-it-py>=3.0.0",
    "beautifulsoup4>=4.12.0",
    "slowapi>=0.1.9",
    "python-json-logger>=4.1.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "aiosqlite>=0.20.0",
]
